name: Announcement Notifier

on:
  schedule:
    # every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-announcements:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: announcement-notifier/requirements.txt

      - name: Install dependencies
        run: pip install -r announcement-notifier/requirements.txt

      - name: Check for new announcements and notify
        working-directory: announcement-notifier
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_IDS: ${{ secrets.LINE_TARGET_IDS }}
          SMTP_USER: "a4190222@gmail.com"
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ANNOUNCE_EMAIL_TO: "a4190222@gmail.com,555094@yphs.tw"
        run: python -m src.main

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add announcement-notifier/data/
          git diff --cached --quiet || git commit -m "chore: update announcement state"
          git push
